# ============================================================
# 支付服务专属配置 - pay-service.yaml
# Nacos Data ID: pay-service.yaml
# Nacos Group: DEFAULT_GROUP
# 服务名: yu-mall-pay-service
# 端口: 8086
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.100.128}:${MYSQL_PORT:3306}/mall-pay?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false

# RabbitMQ 队列/交换机/路由键说明（均在 Java 代码中通过注解声明，此处仅记录）:
# 发送:
#   pay-service.topic / pay-order-balance          → pay-service (支付订单)
# 接收:
#   pay-service.queue (pay-service.topic, key=pay-order-balance)

# 注意: pay-service pom.xml 缺少 spring-cloud-starter-alibaba-nacos-discovery
#       和 spring-boot-starter-web，需要补充才能正常注册和接收 HTTP 请求
