# ============================================================
# 管理服务专属配置 - admin-service.yaml
# Nacos Data ID: admin-service.yaml
# Nacos Group: DEFAULT_GROUP
# 服务名: yu-mall-admin-service
# 端口: 8084
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.100.128}:${MYSQL_PORT:3306}/mall-sys?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:192.168.100.128}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 3

  # 文件上传配置（管理端上传商品图片等）
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Seata 在 admin-service 中默认禁用
seata:
  enabled: false

# JWT 配置 - 用于管理端 Token
# JwtProperties: location, password, alias, tokenTTL
yu:
  jwt:
    location: classpath:/jwt.jks
    password: ${JWT_KEYSTORE_PASSWORD:yumall}
    alias: ${JWT_KEY_ALIAS:yumall}
    token-ttl: 10m

# 文件存储配置（x-file-storage + 阿里云 OSS）
x-file-storage:
  default-platform: aliyun-oss
  aliyun-oss:
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY:your-access-key}
    access-key-secret: ${ALIYUN_OSS_ACCESS_SECRET:your-access-secret}
    bucket-name: ${ALIYUN_OSS_BUCKET:yu-mall}
    end-point: ${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    domain: ${ALIYUN_OSS_DOMAIN:}
