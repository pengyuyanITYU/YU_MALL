# ============================================================
# 订单服务专属配置 - order-service.yaml
# Nacos Data ID: order-service.yaml
# Nacos Group: DEFAULT_GROUP
# 服务名: yu-mall-order-service
# 端口: 8083
# ============================================================

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.100.128}:${MYSQL_PORT:3306}/mall-order?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false

  # Redis 配置（订单服务使用 Redis 做购物车等）
  data:
    redis:
      host: ${REDIS_HOST:192.168.100.128}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

# RabbitMQ 队列/交换机/路由键说明（均在 Java 代码中通过注解声明，此处仅记录）:
# 发送:
#   order-item-service.direct / item-sold          → product-service (扣减库存)
#   order-service.direct / order-cancel            → order-service (订单超时取消)
#   order-service.direct / order-confirm           → order-service (订单超时确认收货)
# 接收:
#   order-cancel.queue  (order-service.direct, key=order-cancel)
#   order-confirm.queue (order-service.direct, key=order-confirm)

# ShedLock 定时任务配置（order-service 使用了 ShedLock）
shedlock:
  defaults:
    lock-at-most-for: 10m
    lock-at-least-for: 1m
