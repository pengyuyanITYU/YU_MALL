# ============================================================
# 共享 Feign 配置 - shared-feign.yaml
# Nacos Data ID: shared-feign.yaml
# Nacos Group: DEFAULT_GROUP
# 引用此配置的服务: order-service, pay-service, product-service,
#                   user-center-service, search-service, ai-service,
#                   admin-service
# ============================================================

feign:
  okhttp:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
      # 指定服务超时配置（按需覆盖）
      yu-mall-item-service:
        connect-timeout: 3000
        read-timeout: 5000
  httpclient:
    enabled: false
    max-connections: 200
    max-connections-per-route: 50

spring:
  cloud:
    openfeign:
      lazy-attributes-resolution: true
